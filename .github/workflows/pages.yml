name: Deploy site to GitHub Pages

# Settings -> Pages -> Source 需要选 "GitHub Actions"，否则这个 workflow 的部署步骤会被拒绝。
on:
  push:
    branches: [yuyang/dev] # 换成你实际要发布的分支
  workflow_dispatch:   # 也可以在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，排队而不是相互取消，避免把旧版本盖回去。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # base_path 由 Pages 给出：用户主站是空字符串，项目站点是 /<repo>。
      - name: Build site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
