# Top navigation of the site.
#
# The front page is a single page, so every entry below points to an anchor of a
# section rendered by _layouts/home.html. The `section` key is what the
# scrollspy in assets/js/onepage.js uses to highlight the current section.
#
# Adding an entry here is not enough on its own: the matching section has to be
# included in _layouts/home.html as well.

main:
  - title: "Bio"
    url: /#bio
    section: bio

  - title: "Publications"
    url: /#publications
    section: publications

  - title: "Projects"
    url: /#projects
    section: projects

  - title: "CV"
    url: /#cv
    section: cv
