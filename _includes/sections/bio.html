{% assign a = site.author %}
{% assign about_body = content | strip %}

<section id="bio" class="op-section">
  {% include sections/heading.html index="01" title="Bio" id="bio" %}

  <div class="op-prose reveal">
    {% if about_body != "" %}
      {{ content }}
    {% elsif a.bio %}
      <p>{{ a.bio }}</p>
    {% endif %}
  </div>
</section>
