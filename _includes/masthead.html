{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist">
            <a href="{{ site.baseurl }}/">{{ site.title }}</a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign link_href = link.url %}
            {% else %}
              {% assign link_href = link.url | prepend: site.baseurl %}
            {% endif %}
            <li class="masthead__menu-item {% if link.section == nil and page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ link_href }}"{% if link.section %} data-section="{{ link.section }}"{% endif %}>{{ link.title }}</a>
            </li>
          {% endfor %}
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a role="button" aria-labelledby="theme-icon"><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i></a>
          </li>
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
    </div>
  </div>
</div>
<div class="scroll-progress" aria-hidden="true"><span class="scroll-progress__bar"></span></div>
